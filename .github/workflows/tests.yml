name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Pruebas unitarias (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v

  blender:
    name: Blender ${{ matrix.blender }} sin interfaz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender: ['4.2.23']
    env:
      BLENDER_DIR: ${{ github.workspace }}/../blender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas que Blender necesita en Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ matrix.blender }}-linux-x64
      - name: Descargar Blender (blender.org, con verificación sha256)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          V=${{ matrix.blender }}; S=${V%.*}
          mkdir -p "$BLENDER_DIR" && cd "$BLENDER_DIR"
          curl -sSfLO "https://download.blender.org/release/Blender$S/blender-$V-linux-x64.tar.xz"
          curl -sSfL "https://download.blender.org/release/Blender$S/blender-$V.sha256" | grep linux-x64.tar.xz | sha256sum -c -
          tar -xJf "blender-$V-linux-x64.tar.xz" && rm "blender-$V-linux-x64.tar.xz"
      - name: Ubicar Blender
        run: echo "BLENDER_STEROIDS_BLENDER=$(ls -d "$BLENDER_DIR"/blender-*-linux-x64)/blender" >> "$GITHUB_ENV"
      - name: Pruebas unitarias con el Python de Blender
        run: |
          "$BLENDER_STEROIDS_BLENDER" -b --factory-startup --python-exit-code 1 --python-expr "
          import sys, unittest
          sys.argv = ['blender']
          r = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          if not r.wasSuccessful():
              raise SystemExit(1)
          "
      - name: Integración (ejemplos, curvas, GLB, idempotencia, malla/curva, errores)
        run: python tests/integration/smoke.py "$RUNNER_TEMP/smoke"
      - name: status y doctor
        if: always()
        run: |
          python bin/blender_cli.py status
          python bin/blender_cli.py doctor || true
